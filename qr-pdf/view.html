<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f4f1;
    --surface: #ffffff;
    --ink: #17171b;
    --muted: #6c6c78;
    --line: #e4e3dd;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f13; --surface: #17171d; --ink: #f1f1f4;
      --muted: #9b9baa; --line: #2b2b35; --accent: #8b85ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 40px 20px 56px; }
  .eyebrow {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px;
  }
  h1 {
    margin: 0 0 22px; font-size: clamp(26px, 6vw, 38px);
    line-height: 1.12; letter-spacing: -.02em; font-weight: 640;
    overflow-wrap: anywhere;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  a.btn {
    display: inline-block; text-decoration: none;
    font-size: 15px; font-weight: 560; padding: 13px 22px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.btn:active { transform: translateY(1px); }
  .frame {
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: var(--surface); height: 76vh; min-height: 420px;
  }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* Phones rarely render an embedded PDF usefully; the buttons above do the work. */
  @media (max-width: 700px), (pointer: coarse) { .frame, .note { display: none; } }
  .note { color: var(--muted); font-size: 14px; margin: 0; }
  .err {
    padding: 20px; border-radius: 12px; background: var(--surface);
    border: 1px solid var(--line); color: var(--muted);
  }
  .err b { color: var(--ink); }
  footer {
    border-top: 1px solid var(--line); padding: 18px 20px;
    color: var(--muted); font-size: 12.5px; text-align: center;
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow" id="eyebrow">Document</p>
  <h1 id="title">Loading…</h1>
  <div id="body"></div>
</main>
<footer>Scanned a code to get here? You are in the right place.</footer>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var file = params.get('f') || '';
  var title = params.get('t') || '';

  // Only ever open a PDF sitting in this folder's pdfs/ directory: no slashes,
  // no traversal, no absolute addresses. Anything else is refused, so a doctored
  // link cannot turn this page into a redirect to somewhere it does not control.
  var SAFE = /^[A-Za-z0-9][A-Za-z0-9 ._-]{0,120}\.pdf$/i;
  var valid = SAFE.test(file) && file.indexOf('..') === -1;

  var titleEl = document.getElementById('title');
  var bodyEl = document.getElementById('body');

  if (!valid) {
    document.title = 'Document not found';
    document.getElementById('eyebrow').textContent = 'Not found';
    titleEl.textContent = 'That document is not available';
    var err = document.createElement('div');
    err.className = 'err';
    err.innerHTML = '<b>The link is incomplete or points somewhere this page cannot open.</b><br>' +
      'This page only opens PDFs stored alongside it. Check the address, or ask whoever ' +
      'shared the code for a fresh one.';
    bodyEl.appendChild(err);
    return;
  }

  var href = 'pdfs/' + encodeURIComponent(file);
  var heading = (title || file.replace(/\.pdf$/i, '').replace(/[-_]+/g, ' ')).slice(0, 120);
  heading = heading.charAt(0).toUpperCase() + heading.slice(1);

  document.title = heading;
  titleEl.textContent = heading;

  var actions = document.createElement('div');
  actions.className = 'actions';

  var open = document.createElement('a');
  open.className = 'btn primary';
  open.href = href;
  open.textContent = 'Open the PDF';
  actions.appendChild(open);

  var dl = document.createElement('a');
  dl.className = 'btn';
  dl.href = href;
  dl.setAttribute('download', file);
  dl.textContent = 'Download';
  actions.appendChild(dl);

  bodyEl.appendChild(actions);

  var frame = document.createElement('div');
  frame.className = 'frame';
  var iframe = document.createElement('iframe');
  iframe.src = href;
  iframe.title = heading;
  frame.appendChild(iframe);
  bodyEl.appendChild(frame);

  var note = document.createElement('p');
  note.className = 'note';
  note.textContent = 'If the preview does not appear, use the buttons above.';
  bodyEl.appendChild(note);
})();
</script>
</body>
</html>
