<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Vassallo Developments</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<!-- Served by Cloudflare Pages for any address that does not exist, with a
     real 404 status. Paths are absolute because it can be served from any
     depth. No scripts: nothing here needs them. -->
<style>
:root{--paper:#F1ECE3;--ink:#17130E;--ink-soft:#4A443B;--brass:#816544;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--paper:#151210;--ink:#EDE6D8;--ink-soft:#B4AB9B;--brass:#C4A277}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem 16px;background:var(--paper);color:var(--ink);font:400 1.05rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:34rem}
img{display:block;width:180px;height:auto;margin-bottom:2.5rem}
@media (prefers-color-scheme:dark){img{filter:invert(1)}}
h1{font:400 clamp(2.2rem,7vw,3.4rem)/1.05 Georgia,"Times New Roman",serif;margin:0 0 1rem}
p{color:var(--ink-soft);margin:0 0 1.8rem}
a.home{display:inline-block;color:var(--paper);background:var(--ink);padding:.9em 1.8em;border-radius:100px;text-decoration:none;letter-spacing:.06em;font-size:.9rem}
a.home:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/images/logo.png" alt="Vassallo Developments" width="656" height="247">
  <h1>We can’t find that page.</h1>
  <p>It may have moved, or the address may have a typo. Everything we do starts from the home page.</p>
  <a class="home" href="/">Go to the home page</a>
</main>
</body>
</html>
