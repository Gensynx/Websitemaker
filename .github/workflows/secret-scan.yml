# Fails any push or pull request whose history contains something that looks
# like a key, token or password. The repository is public, so a secret that
# lands here is exposed the moment it is pushed: this is the alarm, and the
# fix is always to revoke the key first, then clean up.
#
# gitleaks is downloaded as a release binary and checked against its published
# SHA-256 (gitleaks-action needs a paid licence for organisation accounts).
# The checkout action is pinned to a commit, not a movable tag.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
