# Uploads Coveworks Lab, and the portfolio sites its work list links to (under /work/),
# to the IONOS webspace behind www.coveworks.tech whenever any of them changes on main,
# or on demand from the Actions tab. coveworks-lab/sitegen/package.py decides what goes up.
#
# Needs three repository secrets (Settings, Secrets and variables, Actions):
#   IONOS_SFTP_HOST      e.g. access-1234567.webspace-host.com (IONOS, Hosting, SFTP & SSH)
#   IONOS_SFTP_USER      the SFTP user shown on the same page
#   IONOS_SFTP_PASSWORD  that user's password
# and, if the site does not live at the root of the SFTP login, one variable:
#   IONOS_REMOTE_DIR     the folder holding index.html, e.g. /public (default /)
#
# Notes, build scripts and master files stay out. Only files changed since the last upload
# are sent. Files that have left the repository are removed from assets/ and work/, the two
# folders this site owns; nothing else on the server is ever deleted.
name: Deploy Coveworks to IONOS

on:
  push:
    branches: [main]
    paths:
      - 'coveworks-lab/**'
      - 'vassallo/**'
      - 'index.html'
      - 'assets/**'
      - 'aesthetics-clinic/**'
      - 'accountants/**'
      - 'accountants-premium/**'
      - 'accountants-ledger/**'
      - 'streetwear/**'
      - 'car-hire/**'
      - 'mobile-mechanic/**'
      - 'coveworks-scifi/**'
      - '.github/workflows/deploy-coveworks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-coveworks
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the packager stamps each file with its last commit time

      - name: Check the IONOS secrets are set
        id: secrets
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER_NAME: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing IONOS_SFTP_HOST"
          [ -n "$USER_NAME" ] || missing="$missing IONOS_SFTP_USER"
          [ -n "$PASS" ] || missing="$missing IONOS_SFTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed. Add these repository secrets to turn on automatic uploads:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Stage the webspace
        if: steps.secrets.outputs.ready == 'true'
        run: python3 coveworks-lab/sitegen/package.py

      - name: Upload to IONOS
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER_NAME: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.IONOS_REMOTE_DIR || '/' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:timeout 30
            open --env-password -u \"$USER_NAME\" sftp://$HOST
            mirror --reverse --verbose --parallel=4 dist/site \"$REMOTE_DIR\"
            mirror --reverse --verbose --delete dist/site/assets \"$REMOTE_DIR/assets\"
            mirror --reverse --verbose --delete dist/site/work \"$REMOTE_DIR/work\"
          "

      - name: Check the live site
        if: steps.secrets.outputs.ready == 'true'
        env:
          SITE: ${{ vars.IONOS_SITE_URL || 'https://www.coveworks.tech' }}
        run: |
          sleep 5
          fail=0
          for path in / /configurator.html /preview.html /websites-for.html /websites-for-barbers.html /sitemap.xml /robots.txt \
                      /assets/site.css /assets/fitting.js /assets/fitting-data.js /assets/fonts/doto.woff2 /assets/gen/lab-hero.webp \
                      /work/aesthetics-clinic/ /work/accountants/ /work/streetwear/ /work/car-hire/ /work/mobile-mechanic/ \
                      /work/vassallo/ /work/dar-ul-amir/ /work/flagship/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$path")
            echo "$code $path"
            [ "$code" = "200" ] || fail=1
          done
          # the lead endpoint must run as PHP (a GET is refused with JSON), and its data must not be readable
          lead=$(curl -s "$SITE/api/lead.php")
          echo "api/lead.php -> $lead"
          case "$lead" in '{"ok":false'*) ;; *) echo "::error::api/lead.php is not running as PHP, so leads cannot be captured."; fail=1 ;; esac
          for path in /api/data/leads.php /api/data/.htaccess /api/data/; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$SITE$path")
            echo "$code $path (must not be 200 with content)"
            if [ "$code" = "200" ] && [ -s /tmp/body ]; then echo "::error::$path is readable from the web."; fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::Uploaded, but some files are not being served. Check IONOS_REMOTE_DIR points at the folder with index.html."
            exit 1
          fi
