# Uploads Coveworks Lab to the IONOS webspace behind www.coveworks.tech whenever
# coveworks-lab/ changes on main, or on demand from the Actions tab.
#
# Needs three repository secrets (Settings, Secrets and variables, Actions):
#   IONOS_SFTP_HOST      e.g. access-1234567.webspace-host.com (IONOS, Hosting, SFTP & SSH)
#   IONOS_SFTP_USER      the SFTP user shown on the same page
#   IONOS_SFTP_PASSWORD  that user's password
# and, if the site does not live at the root of the SFTP login, one variable:
#   IONOS_REMOTE_DIR     the folder holding index.html, e.g. /public (default /)
#
# It uploads the pages, assets/ and .htaccess, and leaves out README, CREDITS and
# sitegen/. Nothing is deleted on the server, so other files there are safe.
name: Deploy Coveworks to IONOS

on:
  push:
    branches: [main]
    paths:
      - 'coveworks-lab/**'
      - '.github/workflows/deploy-coveworks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-coveworks
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the IONOS secrets are set
        id: secrets
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER_NAME: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing IONOS_SFTP_HOST"
          [ -n "$USER_NAME" ] || missing="$missing IONOS_SFTP_USER"
          [ -n "$PASS" ] || missing="$missing IONOS_SFTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed. Add these repository secrets to turn on automatic uploads:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to IONOS
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER_NAME: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.IONOS_REMOTE_DIR || '/' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:timeout 30
            open --env-password -u \"$USER_NAME\" sftp://$HOST
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob README.md --exclude-glob sitegen/ --exclude-glob '*.txt' \
              coveworks-lab \"$REMOTE_DIR\"
          "

      - name: Check the live site
        if: steps.secrets.outputs.ready == 'true'
        env:
          SITE: ${{ vars.IONOS_SITE_URL || 'https://www.coveworks.tech' }}
        run: |
          sleep 5
          fail=0
          for path in / /configurator.html /assets/site.css /assets/fitting.js /assets/fonts/doto.woff2 /assets/gen/lab-hero.webp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$path")
            echo "$code $path"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "::error::Uploaded, but some files are not being served. Check IONOS_REMOTE_DIR points at the folder with index.html."
            exit 1
          fi
